name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Debug Keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          echo "Debug keystore decoded successfully."
        fi

    - name: Decode Release Keystore
      id: release-keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore decoded successfully."
        else
          echo "has_keystore=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
        fi
        if [ ! -f app/google-services.json ]; then
          echo "::warning::app/google-services.json is missing! Please configure GOOGLE_SERVICES_JSON in your GitHub repository secrets."
        else
          echo "Successfully created app/google-services.json"
        fi

    - name: Create local.properties with Secrets
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        APP_OPEN_AD_ID: ${{ secrets.APP_OPEN_AD_ID }}
        BANNER_AD_ID: ${{ secrets.BANNER_AD_ID }}
        INTERSTITIAL_AD_ID: ${{ secrets.INTERSTITIAL_AD_ID }}
        REWARDED_AD_ID: ${{ secrets.REWARDED_AD_ID }}
      run: |
        echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
        echo "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" >> local.properties
        echo "APP_OPEN_AD_ID=$APP_OPEN_AD_ID" >> local.properties
        echo "BANNER_AD_ID=$BANNER_AD_ID" >> local.properties
        echo "INTERSTITIAL_AD_ID=$INTERSTITIAL_AD_ID" >> local.properties
        echo "REWARDED_AD_ID=$REWARDED_AD_ID" >> local.properties

    - name: Build and Test Debug
      run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release Bundle (AAB)
      if: steps.release-keystore.outputs.has_keystore == 'true'
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload Release AAB
      if: steps.release-keystore.outputs.has_keystore == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/bundle/release/app-release.aab

